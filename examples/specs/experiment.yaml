# Actual external LLM batch; import-checker.json freezes the private evaluation input.
schema_version: "0.1.0"
experiment_id: "production-batch"
tasks:
  - id: "production"
    manifest: "../../runs/production-task/manifest.json"
configurations:
  - id: "direct-highs"
    run_config: "benchmark-run.yaml"
repeats: 2
budget:
  max_llm_attempts: 2
  max_total_tokens: 60000
  max_solver_calls: 2
  wall_time_s: 600
  max_concurrency: 2
exclusions: []
