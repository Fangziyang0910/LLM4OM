# Explicit OptiMUS input variant for original text or ordinary public data.
schema_version: "0.2.0"
method:
  plugin_id: "llm4om.methods.optimus_inline"
  config:
    rag_mode: null
llm:
  provider_plugin_id: "llm4om.providers.openai_compatible"
  model: "deepseek-flash"
  config:
    base_url: "https://api.deepseek.com/v1"
    credential_env: "LLM4OM_LLM_API_KEY"
    max_output_tokens: 32768
    max_retries: 0
    timeout_s: 180
model_backend:
  plugin_id: "llm4om.model_backends.pyomo_factory"
solver:
  plugin_id: "llm4om.solvers.highs"
  options:
    time_limit_s: 10
executor:
  plugin_id: "llm4om.executors.container"
  config:
    network: false
    cpu_limit: 1
    memory_limit_mb: 1024
    wall_time_s: 60
budget:
  max_llm_attempts: 30
  max_total_tokens: 300000
  max_checks: 4
  max_repairs: 3
  max_solver_calls: 12
  wall_time_s: 1800
  max_concurrency: 1
store:
  plugin_id: "llm4om.stores.filesystem"
  config:
    root: "../../runs"
reporters:
  - plugin_id: "llm4om.reporters.jsonl"
  - plugin_id: "llm4om.reporters.markdown"
