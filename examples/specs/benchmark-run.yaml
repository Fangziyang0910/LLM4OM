# Actual external LLM plus container HiGHS; credentials remain in .env.
schema_version: 0.2.0
method:
  plugin_id: llm4om.methods.direct
  config:
    formulation_mode: five_element
    output_mode: lp_ir
llm:
  provider_plugin_id: llm4om.providers.openai_compatible
  model: deepseek-v4-pro-0813
  config:
    base_url: https://api.x5m5x.com/v1
    credential_env: LLM4OM_LLM_API_KEY
    max_output_tokens: 8192
    max_retries: 0
    timeout_s: 90
compiler:
  plugin_id: llm4om.compilers.lp_ir_to_pyomo
model_backend:
  plugin_id: llm4om.model_backends.pyomo_factory
solver:
  plugin_id: llm4om.solvers.highs
  options:
    time_limit_s: 10
executor:
  plugin_id: llm4om.executors.container
  config:
    network: false
    cpu_limit: 1
    memory_limit_mb: 512
    wall_time_s: 30
budget:
  max_llm_attempts: 1
  max_total_tokens: 30000
  max_checks: 1
  max_repairs: 0
  max_solver_calls: 1
  wall_time_s: 300
  max_concurrency: 1
store:
  plugin_id: llm4om.stores.filesystem
  config:
    root: ../../runs
reporters:
- plugin_id: llm4om.reporters.jsonl
- plugin_id: llm4om.reporters.markdown
