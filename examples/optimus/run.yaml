# Set the service endpoint and actual model API ID before running.
schema_version: 0.2.0
method:
  plugin_id: llm4om.methods.optimus
  config:
    rag_mode: null
    params_data_id: params
    labels_data_id: labels
llm:
  provider_plugin_id: llm4om.providers.openai_compatible
  model: your-model-id
  config:
    base_url: https://api.example.com/v1
    credential_env: LLM4OM_LLM_API_KEY
    max_output_tokens: 16384
    max_retries: 0
    timeout_s: 180
model_backend:
  plugin_id: llm4om.model_backends.gurobipy
solver:
  plugin_id: llm4om.solvers.gurobi
  options:
    time_limit_s: 10
executor:
  plugin_id: llm4om.executors.container
  config:
    network: false
    cpu_limit: 1
    memory_limit_mb: 512
    wall_time_s: 30
budget:
  max_llm_attempts: 30
  max_total_tokens: 180000
  max_checks: 1
  max_repairs: 3
  max_solver_calls: 6
  wall_time_s: 1800
  max_concurrency: 1
store:
  plugin_id: llm4om.stores.filesystem
  config:
    root: ../../runs
reporters:
- plugin_id: llm4om.reporters.jsonl
- plugin_id: llm4om.reporters.markdown
