[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4om-fixture-method"
version = "0.1.0"
description = "An independently installed engineering method for LLM4OM integration tests"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = ["llm4om>=0.2.0,<0.6.0"]

[project.entry-points."llm4om.plugins"]
fixture_method = "llm4om_fixture_method:plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm4om_fixture_method = ["manifest.json"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
