[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4om-fixture-compiler"
version = "0.1.0"
description = "Independent deterministic compiler format variant for LLM4OM"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = ["llm4om>=0.21.0,<0.22.0"]

[project.entry-points."llm4om.plugins"]
fixture_compiler = "llm4om_fixture_compiler:plugin"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
