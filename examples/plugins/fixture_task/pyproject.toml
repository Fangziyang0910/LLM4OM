[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4om-fixture-task"
version = "0.1.0"
description = "Independent Task and Evaluator integration fixture for LLM4OM"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = ["llm4om>=0.23.0,<0.24.0"]

[project.entry-points."llm4om.plugins"]
fixture_task = "llm4om_fixture_task:task_plugin"
fixture_evaluator = "llm4om_fixture_task:evaluator_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
