[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4om-fixture-execution"
version = "0.1.0"
description = "Independent Backend/Solver engineering fixture"
requires-python = ">=3.11,<3.13"
dependencies = ["llm4om>=0.21.0,<0.22.0"]

[project.entry-points."llm4om.plugins"]
fixture_backend = "llm4om_fixture_execution:backend"
fixture_solver = "llm4om_fixture_execution:solver"
fixture_native_backend = "llm4om_fixture_execution:native_backend"
fixture_native_solver = "llm4om_fixture_execution:native_solver"

[tool.setuptools.packages.find]
where = ["src"]
