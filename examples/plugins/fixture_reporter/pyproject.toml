[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4om-fixture-reporter"
version = "0.1.0"
description = "Independent public result Reporter integration fixture"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = ["llm4om>=0.29.0,<0.30.0"]

[project.entry-points."llm4om.plugins"]
fixture_reporter = "llm4om_fixture_reporter:plugin"

[tool.setuptools.packages.find]
where = ["src"]
