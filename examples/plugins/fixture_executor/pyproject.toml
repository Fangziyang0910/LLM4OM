[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4om-fixture-executor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["llm4om>=0.36,<0.37"]

[project.entry-points."llm4om.plugins"]
fixture_container = "llm4om_fixture_executor:container_plugin"
fixture_local = "llm4om_fixture_executor:local_plugin"

[tool.setuptools.packages.find]
where = ["src"]
