# The whole service in Docker. With LLM4OM_LLM_* in .env (see .env.example):
#   docker compose up -d --build
# With HTTPS on a domain (LLM4OM_DOMAIN in .env): docker compose --profile https up -d --build
# The app runs generated code in sibling sandbox containers through the host's Docker socket (docs/adr/0011).
name: llm4om

services:
  worker:
    # Only builds the sandbox image; the app starts one container from it per solve. Keep the tag equal to
    # WORKER_IMAGE in src/llm4om/sandbox/__init__.py.
    build:
      context: src/llm4om/sandbox
      dockerfile: worker.Dockerfile
    image: llm4om-worker:6
    entrypoint: ["true"]
    network_mode: none

  app:
    build: .
    image: llm4om
    depends_on:
      worker:
        condition: service_completed_successfully
    ports:
      - "${LLM4OM_PORT:-8767}:8767"
    env_file:
      - path: .env
        required: false
    volumes:
      - llm4om-data:/data
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    # The entrypoint needs these to give /data to the service user and switch to it; the server then runs with none.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    restart: unless-stopped

  https:
    # Optional: Caddy gets a certificate for LLM4OM_DOMAIN and forwards to the app, streams included.
    profiles: [https]
    image: caddy:2.10.2-alpine
    command: ["caddy", "reverse-proxy", "--from", "${LLM4OM_DOMAIN:-localhost}", "--to", "app:8767"]
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    restart: unless-stopped

volumes:
  llm4om-data:
  caddy-data:  # certificates and their keys
  caddy-config:
