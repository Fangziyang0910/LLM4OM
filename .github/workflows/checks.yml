name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.19
      # SAC-Opt's small regression models use gurobipy's bundled size-limited license.
      # GCSpy otherwise clones the full JSON dependency history during its CMake build.
      - run: |
          curl -fsSL https://codeload.github.com/nlohmann/json/tar.gz/9cca280a4d0ccf0c08f47a99aa71d1b0e52f8d03 -o /tmp/llm4om-json.tar.gz
          echo '0dbc5e40a01ff142e7e68c03e85247a4dcede2f592d12d3677dee3664d17975a  /tmp/llm4om-json.tar.gz' | sha256sum --check
          mkdir /tmp/llm4om-gcs-json
          tar -xzf /tmp/llm4om-json.tar.gz --strip-components=1 -C /tmp/llm4om-gcs-json
      - run: CMAKE_BUILD_PARALLEL_LEVEL=2 uv sync --locked --config-settings-package gcspy:cmake.define.FETCHCONTENT_SOURCE_DIR_JSON=/tmp/llm4om-gcs-json --extra solve --extra autoformulation --extra gurobi --python "${{ matrix.python }}"
      - run: uv run --locked ruff check
      - run: uv run --locked pytest -W error::UserWarning
      - run: uv build

  host-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.19
      - run: uv build --wheel
      - run: uv venv /tmp/llm4om-host-cli
      - run: uv pip install --python /tmp/llm4om-host-cli/bin/python dist/*.whl
      - run: /tmp/llm4om-host-cli/bin/python tests/check_host_install.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # The built workbench in a browser: a scripted LLM, the local sandbox, no key and no Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: python -m pip install uv==0.12.19
      # gurobipy's bundled size-limited license finds the conflict of the infeasible test model.
      # GCSpy otherwise clones the full JSON dependency history during its CMake build.
      - run: |
          curl -fsSL https://codeload.github.com/nlohmann/json/tar.gz/9cca280a4d0ccf0c08f47a99aa71d1b0e52f8d03 -o /tmp/llm4om-json.tar.gz
          echo '0dbc5e40a01ff142e7e68c03e85247a4dcede2f592d12d3677dee3664d17975a  /tmp/llm4om-json.tar.gz' | sha256sum --check
          mkdir /tmp/llm4om-gcs-json
          tar -xzf /tmp/llm4om-json.tar.gz --strip-components=1 -C /tmp/llm4om-gcs-json
      - run: CMAKE_BUILD_PARALLEL_LEVEL=2 uv sync --locked --config-settings-package gcspy:cmake.define.FETCHCONTENT_SOURCE_DIR_JSON=/tmp/llm4om-gcs-json --extra solve --extra gurobi
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker compose build
      - run: docker run --rm --network none --pull never llm4om-worker:12 python -c "import pyomo, highspy, ortools, cpmpy, gurobipy, pulp, cvxpy, clarabel, osqp, scs, pyscipopt, casadi, coptpy, mosek"
      - run: docker run --rm --pull never --entrypoint llm4om llm4om --help
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.19
      - run: uv sync --locked
      - run: uv run --locked pytest tests/test_docker.py tests/test_host.py tests/test_modeling_interfaces.py tests/test_modeling_backends.py -m docker -W error::UserWarning
        env:
          LLM4OM_TEST_DOCKER: "1"
