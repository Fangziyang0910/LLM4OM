name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.19
      - run: uv sync --locked --extra dev --python "${{ matrix.python }}"
      - run: uv run --locked mypy
      - run: uv run --locked python scripts/check_repository.py
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build
