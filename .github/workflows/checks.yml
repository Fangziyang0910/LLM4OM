name: Checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.19
      - run: uv sync --locked --extra dev --extra solve --extra gurobi --python "${{ matrix.python }}"
      - run: uv run --locked mypy
      - run: uv run --locked python scripts/build_worker_image.py
      - run: uv run --locked python scripts/check_repository.py
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build
