[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4om"
version = "0.41.1"
description = "Automated optimization modeling with large language models: problem to formulation, code and solution"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "Ziyang Fang" }]
keywords = ["optimization modeling", "large language models", "operations research", "MILP", "LangGraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "langchain>=1.4.7,<2",
    "langchain-core>=1.6.13,<2",
    "langchain-openai>=1.7.2,<2",
    "langchain-anthropic>=1.0,<2",
    "langchain-deepseek>=1.0,<2",
    "langchain-openrouter>=0.2.9,<0.3",
    "openrouter>=0.11,<0.12",  # llm.py validates the reasoning options with its request models
    "langgraph>=1.2.16,<2",
    # The LangGraph server with its in-memory runtime: it runs, streams and stores runs, with no license key.
    "langgraph-cli[inmem]>=0.4.37,<0.5",
    "langgraph-api>=0.16,<0.17",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    # OptiTree parses model replies with json_repair; 0.60.1 is the first release without GHSA-xf7x-x43h-rpqh.
    "json-repair==0.60.1",
    # AutoFormulation ranks candidates with numpy and scikit-learn.
    "numpy>=2,<3",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
# Host-side solving for `--sandbox local` and tests. The Docker worker installs its own copies.
# Match the HiGHS ABI bundled with OR-Tools 9.15 (google/or-tools#5246).
solve = ["Pyomo==6.10.1", "highspy==1.12.0", "ortools==9.15.6755", "cpmpy==1.1.0", "PuLP==3.3.2", "cvxpy==1.8.2",
         "clarabel==0.11.1"]
gurobi = ["gurobipy==13.0.3"]
# AutoFormulation's equivalence scripts use SymPy and Z3; the Docker worker has them, `--sandbox local` needs these.
autoformulation = ["z3-solver==5.1.0.0", "sympy>=1.13,<2"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18"]

[project.urls]
Homepage = "https://github.com/Fangziyang0910/LLM4OM"
Documentation = "https://github.com/Fangziyang0910/LLM4OM/tree/main/docs"
Changelog = "https://github.com/Fangziyang0910/LLM4OM/blob/main/CHANGELOG.md"
Issues = "https://github.com/Fangziyang0910/LLM4OM/issues"

[project.scripts]
llm4om = "llm4om.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm4om = ["methods/optitree/source/*", "methods/*/README.md", "server/examples_data/*.json", "server/examples_data/*.txt", "server/web_assets/*", "server/web_assets/**/*", "sandbox/worker.Dockerfile"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Reference data stays as published; all executable Python is checked.
extend-exclude = ["src/llm4om/methods/optitree/source"]

[tool.ruff.lint]
# Pyflakes, syntax-level pycodestyle errors and import order; explicit, so a ruff upgrade does not change the rules.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: integration tests that require Docker and the current worker image"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
