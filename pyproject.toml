[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4om"
version = "0.37.0"
description = "A platform for automated optimization modeling"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = ["PyYAML==6.0.1", "jsonschema==4.10.3"]

[project.optional-dependencies]
# Match the HiGHS ABI bundled with OR-Tools 9.15 (google/or-tools#5246).
solve = [
    "Pyomo==6.10.1",
    "highspy==1.12.0",
]
gurobi = ["Pyomo==6.10.1", "gurobipy==13.0.3", "packaging==25.0"]
dev = ["mypy==2.4.0", "types-PyYAML==6.0.12.20260906", "types-jsonschema==4.26.0.20261006"]
ortools = [
    "ortools==9.15.6755",
]
search = [
    "z3-solver==5.1.0.0",
]

[project.scripts]
llm4om = "llm4om.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/llm4om"]

[[tool.mypy.overrides]]
module = ["pyomo.*", "highspy.*", "gurobipy.*", "ortools.*", "z3.*"]
ignore_missing_imports = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.setuptools.package-data]
llm4om = ["optimus_source/*.txt", "optimus_source/*.json", "optitree_source/*.txt", "optitree_source/*.json", "optitree_source/*.jsonl", "benchmark_sources/*.json", "benchmark_sources/*.txt", "nlp4lp_source.json", "web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]
