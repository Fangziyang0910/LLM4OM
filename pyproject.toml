[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4om"
version = "0.38.0"
description = "A platform for automated optimization modeling"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "langchain==1.4.6",
    "langchain-core==1.6.12",
    "langchain-openai==1.7.0",
    "langchain-anthropic>=1.0,<2",
    "langchain-deepseek>=1.0,<2",
    "langgraph==1.2.14",
    "langgraph-prebuilt==1.1.0",
    "langgraph-checkpoint==4.2.0",
    # The LangGraph server with its in-memory runtime: it runs, streams and stores runs, with no license key.
    "langgraph-cli[inmem]==0.4.33",
    "langgraph-api==0.10.3",
    "langgraph-runtime-inmem==0.30.3",
    "fastapi>=0.115,<1",
    "python-dotenv>=1.0,<2",
    # OptiTree parses the upstream model replies with json_repair; AutoFormulation ranks with numpy and scikit-learn.
    "json-repair==0.30.0",
    "numpy>=2,<3",
    "scikit-learn>=1.5,<2",
    "langchain-openrouter==0.2.9",
]

[project.optional-dependencies]
# Host-side solving for `--sandbox local` and tests. The Docker worker installs its own copies.
# Match the HiGHS ABI bundled with OR-Tools 9.15 (google/or-tools#5246).
solve = ["Pyomo==6.10.1", "highspy==1.12.0", "ortools==9.15.6755", "cpmpy==1.1.0"]
gurobi = ["gurobipy==13.0.3"]
# AutoFormulation's equivalence scripts use SymPy and Z3; the Docker worker has them, `--sandbox local` needs these.
autoformulation = ["z3-solver==5.1.0.0", "sympy>=1.13,<2"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.15,<0.16"]

[project.scripts]
llm4om = "llm4om.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm4om = ["methods/optitree/source/*", "methods/*/README.md", "server/examples_data/*.json", "server/examples_data/*.txt", "server/web_assets/*", "server/web_assets/**/*", "sandbox/worker.Dockerfile"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Reference data stays as published; all executable Python is checked.
extend-exclude = ["src/llm4om/methods/optitree/source"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
